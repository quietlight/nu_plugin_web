[package]
name = "nu_plugin_web"
version = "0.1.0"
edition = "2024"
description = "Nushell plugin: web search and page extraction through Parallel's Search and Extract APIs"
license = "MIT"
publish = false

[dependencies]
# Path deps into the patched nushell checkout next door, so this plugin is
# always built against the exact nu that runs it (the plugin protocol is
# locked to nu's minor version). Rebuild after every nushell bump.
nu-plugin = { path = "../nushell/crates/nu-plugin" }
nu-protocol = { path = "../nushell/crates/nu-protocol", features = ["plugin"] }
serde_json = "1.0"
ureq = { version = "3.4", features = ["json"] }

[profile.release]
strip = true
